
name: Build Manhunt Manager

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Minecraft Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build Manhunt Manager
        run: gradle --no-daemon clean build

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManhuntManager-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
